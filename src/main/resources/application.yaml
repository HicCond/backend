spring:
  application:
    name: quiz-backend

  datasource:
    url: jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    # Runs data.sql only after Hibernate has created the tables.
    defer-datasource-initialization: true
    # Disabled so lazy proxies cannot escape the service layer.
    open-in-view: false

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

quiz:
  title: "World Geography"
  description: "Twenty multiple-choice questions about the physical and political geography of the world. Each question is worth a fixed number of points; you pass by scoring more than 600 out of 1000."
  passing-score: 600
  allowed-origins: http://localhost:3000,http://localhost:5173

logging:
  file:
    name: logs/quiz.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  level:
    com.example.quiz: INFO
