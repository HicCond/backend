spring:
  application:
    name: quiz-backend

  datasource:
    url: jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    # Runs data.sql only after Hibernate has created the tables.
    defer-datasource-initialization: true
    # Disabled so lazy proxies cannot escape the service layer.
    open-in-view: false

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console
